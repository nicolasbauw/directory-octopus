[package]
name = "directory_octopus"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
chrono = "0.4.45"
eframe = "0.36.2"
egui = "0.36.2"
filetime = "0.2.29"
glob = "0.3.4"
open = "5.4.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = "0.39.6"
toml = "1.1.6"

# Optimisé pour la taille : le binaire release est ensuite compressé avec
# `upx --best` par le PKGBUILD (cf. packaging/).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
